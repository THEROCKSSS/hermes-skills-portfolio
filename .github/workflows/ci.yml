name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate SKILL.md frontmatter
        # Real YAML parse, not a grep for `name:`/`description:` lines. The grep
        # version passed a file whose description contained an unquoted colon —
        # something no YAML loader can read — because the lines were merely
        # *present*. This also checks name matches the directory.
        run: python3 scripts/check_content_quality.py frontmatter

      - name: Run the test suite
        # CI previously ran no tests at all.
        run: python3 -m pytest tests/ -q

      - name: Validate install URLs are installable
        # A GitHub *blob* URL returns text/html, so `hermes skills install <blob>`
        # writes GitHub's page markup into the skill body and still exits 0.
        # Every install_url must be a raw.githubusercontent.com SKILL.md URL, and
        # no markdown may document a blob URL as the install command.
        run: python3 scripts/normalize_install_urls.py --check

      - name: Validate generated artefacts are current
        # sitemap and feed are both derived — from skills-index.json and from
        # changelog-data.js respectively. Adding a skill or a changelog entry
        # without regenerating leaves the published copies silently behind.
        run: |
          set -eu
          python3 scripts/generate_sitemap.py --check
          python3 scripts/generate_feed.py --check

      - name: Validate no invented metrics in skill copy
        # The project's own rule: no fabricated data points. Deterministic
        # fabrications fail here; hype adjectives are advisory and reported by
        # the weekly quality workflow instead.
        run: python3 scripts/check_content_quality.py metrics

      - name: Validate cached skill content is not stale
        # skills-index.json caches skillmd_content/readme_content for the detail
        # overlay. Editing a SKILL.md without refreshing the cache silently ships
        # the old text (this drifted for 46 of 51 skills once).
        run: python3 scripts/refresh_content_cache.py --check

      - name: Validate skills-index.json sync
        run: |
          set -eu
          if [ ! -f skills-index.json ]; then
            echo "FAIL: skills-index.json missing"
            exit 1
          fi
          dir_count=$(find skills -mindepth 1 -maxdepth 1 -type d | wc -l)
          index_count=$(python3 -c "import json; print(len(json.load(open('skills-index.json'))['skills']))")
          if [ "$dir_count" -ne "$index_count" ]; then
            echo "FAIL: skills-index.json has $index_count entries but $dir_count skill directories exist"
            exit 1
          fi
          echo "skills-index.json is in sync ($index_count entries, $dir_count directories)."

      - name: Validate no forbidden references
        run: |
          set -eu
          forbidden=0
          for pattern in "agentsoul" "localhost:3000"; do
            matches=$(grep -rni "$pattern" README.md CONTRIBUTING.md AGENTS.md docs/index.html docs/app.js docs/styles.css 2>/dev/null || true)
            if [ -n "$matches" ]; then
              echo "FAIL: forbidden reference '$pattern' found:"
              echo "$matches"
              forbidden=$((forbidden+1))
            fi
          done
          if [ "$forbidden" -gt 0 ]; then
            exit 1
          fi
          echo "No forbidden references found in top-level and site files."

      - name: Check site/ and docs/ are in sync
        run: |
          set -eu
          # Diffs every real file under site/ against its docs/ counterpart — not a
          # hardcoded list. A hardcoded list silently stops protecting new pages/files
          # (this one only checked index.html/app.js/styles.css long after the site grew
          # to 4 pages plus css/ and js/ subdirectories with neither file even referenced
          # anymore). site/skills/ has its own check below, so it's excluded here.
          mismatch=0
          while IFS= read -r f; do
            rel="${f#site/}"
            if [ ! -f "docs/$rel" ]; then
              echo "FAIL: docs/$rel is missing (present in site/$rel)"
              mismatch=$((mismatch+1))
            elif ! diff -q "$f" "docs/$rel" > /dev/null 2>&1; then
              echo "FAIL: site/$rel and docs/$rel are out of sync. Run: cp \"$f\" \"docs/$rel\""
              mismatch=$((mismatch+1))
            fi
          done < <(find site -type f -not -path 'site/skills/*')
          if [ ! -f "docs/skills-index.json" ] || ! diff -q "skills-index.json" "docs/skills-index.json" > /dev/null 2>&1; then
            echo "FAIL: skills-index.json and docs/skills-index.json are out of sync. Run: cp skills-index.json docs/"
            mismatch=$((mismatch+1))
          fi
          if [ "$mismatch" -gt 0 ]; then
            exit 1
          fi
          echo "site/ and docs/ are in sync (every real file checked, not a fixed list)."

      - name: Validate per-skill pages exist
        run: |
          set -eu
          missing=0
          for skill_dir in skills/*/; do
            [ -d "$skill_dir" ] || continue
            name=$(basename "$skill_dir")
            for target in "site/skills/$name/index.html" "docs/skills/$name/index.html"; do
              if [ ! -f "$target" ]; then
                echo "FAIL: $target missing. Run: python scripts/generate_skill_pages.py"
                missing=$((missing+1))
              fi
            done
          done
          if [ "$missing" -gt 0 ]; then
            exit 1
          fi
          echo "All per-skill pages exist."

      - name: Validate provenance in skills-index.json
        run: |
          set -eu
          python3 -c "
          import json
          with open('skills-index.json') as f:
              idx = json.load(f)
          errors = []
          for s in idx['skills']:
              sa = s.get('source_attribution')
              if not sa:
                  errors.append(f\"{s['name']}: source_attribution is empty\")
                  continue
              if isinstance(sa, dict):
                  if s.get('source') == 'adapted' and not sa.get('origin_url'):
                      errors.append(f\"{s['name']}: adapted skill requires origin_url\")
          if errors:
              for e in errors: print(f'FAIL: {e}')
              exit(1)
          print(f\"All {len(idx['skills'])} skills have valid provenance.\")
          "
