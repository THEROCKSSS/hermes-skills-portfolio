# Static serving for the Hermes Skills Portfolio.
#
# Deliberately NOT an SPA fallback. `try_files $uri $uri/ /index.html` would
# answer a missing stylesheet or a missing skills-index.json with the catalog
# page at HTTP 200 — so a broken asset looks fine to every curl check while the
# page renders unstyled or empty. Missing means 404 here.

server {
    listen       80;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # Per-skill pages are real directories: /skills/<name>/ -> index.html.
    location / {
        try_files $uri $uri/ =404;
    }

    # The catalog fetches these; a wrong content-type makes the browser refuse
    # to parse them and the page silently renders empty.
    types {
        text/html                   html htm;
        text/css                    css;
        application/javascript      js;
        application/json            json;
        # Generic XML by extension; feed.xml gets the Atom type by path below,
        # since sitemap.xml and feed.xml share an extension but not a type.
        application/xml             xml;
        image/svg+xml               svg;
        text/plain                  txt md;
        font/woff2                  woff2;
    }
    default_type application/octet-stream;
    charset utf-8;

    # Data files change whenever a skill is added; HTML is cheap to revalidate.
    # Only the fingerprint-free assets get a long cache, and none of them are
    # content-hashed here, so nothing is cached beyond an hour.
    location = /feed.xml {
        # A `types` map keyed on the extension beats `default_type`, so the
        # override has to be a types block of its own, not default_type.
        types { application/atom+xml xml; }
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location ~* \.(json|xml)$ {
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
    location ~* \.(css|js|woff2|svg)$ {
        add_header Cache-Control "public, max-age=3600" always;
    }

    # add_header does NOT inherit into a location block that sets its own —
    # each block above therefore repeats what it needs, and these apply to
    # everything else.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip              on;
    gzip_types        text/css application/javascript application/json application/atom+xml image/svg+xml;
    gzip_min_length   1024;

    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;
}
